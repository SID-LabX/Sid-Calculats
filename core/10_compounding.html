<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f3ee;
      color: #2c2c2a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 0.25rem;
      color: #2c2c2a;
    }

    .subtitle {
      font-size: 14px;
      color: #888780;
      margin-bottom: 2rem;
    }

    .card {
      background: #fff;
      border: 0.5px solid #d3d1c7;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.1rem;
    }

    .ctrl:last-child { margin-bottom: 0; }

    .ctrl label {
      font-size: 13px;
      color: #888780;
      min-width: 130px;
    }

    .ctrl input[type=range] {
      flex: 1;
      height: 4px;
      accent-color: #185FA5;
      cursor: pointer;
    }

    .ctrl span {
      font-size: 14px;
      font-weight: 500;
      color: #2c2c2a;
      min-width: 70px;
      text-align: right;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .metric {
      background: #f4f3ee;
      border-radius: 8px;
      padding: 1rem;
    }

    .metric-label {
      font-size: 12px;
      color: #888780;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 500;
      color: #2c2c2a;
    }

    .metric-sub {
      font-size: 12px;
      color: #b4b2a9;
      margin-top: 3px;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #888780;
      flex-wrap: wrap;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 280px;
    }

    @media (max-width: 500px) {
      .metrics { grid-template-columns: 1fr; }
      .ctrl label { min-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Compound Interest Calculator</h1>
    <p class="subtitle">See how your money grows over time with compound interest!</p>

    <div class="card">
      <div class="ctrl">
        <label>Initial deposit</label>
        <input type="range" id="principal" min="100" max="100000" step="1000" value="10000">
        <span id="p-out">$10,000</span>
      </div>
      <div class="ctrl">
        <label>Annual rate</label>
        <input type="range" id="rate" min="1" max="20" step="0.5" value="7">
        <span id="r-out">7%</span>
      </div>
      <div class="ctrl">
        <label>Years</label>
        <input type="range" id="years" min="1" max="50" step="1" value="20">
        <span id="y-out">20 yrs</span>
      </div>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Final balance</div>
        <div class="metric-value" id="final">$38,697</div>
        <div class="metric-sub" id="growth-pct"></div>
      </div>
      <div class="metric">
        <div class="metric-label">Interest earned</div>
        <div class="metric-value" id="interest">$28,697</div>
        <div class="metric-sub" id="deposited"></div>
      </div>
    </div>

    <div class="card">
      <div class="legend">
        <span><span class="dot" style="background:#185FA5;"></span>Total balance</span>
        <span><span class="dot" style="background:#5DCAA5;"></span>Interest earned</span>
        <span><span class="dot" style="background:#D3D1C7;"></span>Amount deposited</span>
      </div>
      <div class="chart-wrap">
        <canvas id="ciChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fmt = v => '$' + Math.round(v).toLocaleString();

    function calcData(P, r, Y) {
      const labels = [], principal = [], interest = [];
      for (let y = 0; y <= Y; y++) {
        const bal = P * Math.pow(1 + r / 100, y);
        labels.push('Yr ' + y);
        principal.push(Math.round(P));
        interest.push(Math.round(bal - P));
      }
      return { labels, principal, interest };
    }

    let chart;

    function update() {
      const P = +document.getElementById('principal').value;
      const r = +document.getElementById('rate').value;
      const Y = +document.getElementById('years').value;

      document.getElementById('p-out').textContent = '$' + P.toLocaleString();
      document.getElementById('r-out').textContent = r + '%';
      document.getElementById('y-out').textContent = Y + ' yrs';

      const { labels, principal, interest } = calcData(P, r, Y);
      const interestEarned = interest[interest.length - 1];
      const finalBal = P + interestEarned;
      const pct = Math.round(interestEarned / P * 100);

      document.getElementById('final').textContent = fmt(finalBal);
      document.getElementById('interest').textContent = fmt(interestEarned);
      document.getElementById('growth-pct').textContent = '+' + pct + '% growth';
      document.getElementById('deposited').textContent = fmt(P) + ' deposited';

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = principal;
        chart.data.datasets[1].data = interest;
        chart.update();
      } else {
        chart = new Chart(document.getElementById('ciChart'), {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Deposited', data: principal, backgroundColor: '#D3D1C7', stack: 'a' },
              { label: 'Interest',  data: interest,  backgroundColor: '#5DCAA5', stack: 'a' }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ' ' + ctx.dataset.label + ': $' + ctx.raw.toLocaleString()
                }
              }
            },
            scales: {
              x: {
                stacked: true,
                ticks: { autoSkip: true, maxTicksLimit: 10, color: '#888' },
                grid: { display: false }
              },
              y: {
                stacked: true,
                ticks: {
                  color: '#888',
                  callback: v => '$' + (v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v)
                },
                grid: { color: 'rgba(128,128,128,0.1)' }
              }
            }
          }
        });
      }
    }

    ['principal', 'rate', 'years'].forEach(id => {
      document.getElementById(id).addEventListener('input', update);
    });

    update();
  </script>
</body>
</html>
